name: tests

on:
  push:
  pull_request:

jobs:
  reward-hacking:
    name: reward-hacking suite + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # The degenerate-policy floors must match the committed eval/floors.json; the suite itself
      # keeps every known exploit as a strict xfail, so a fix that lands without updating the
      # suite fails CI (see eval/tests/test_reward_hacking.py).
      - run: python -m eval.floors --split public --check
      - run: pytest eval/tests etl/tests -q
