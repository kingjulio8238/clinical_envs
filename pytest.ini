[pytest]
# Make `pytest eval/tests` and `pytest epic_sim/tests` work from the repository
# root without installing the package: the test modules import `eval.*`,
# `epic_sim.*` and `etl.*` from here.
pythonpath = .
testpaths = eval/tests epic_sim/tests
markers =
    reward_hacking: degenerate-policy regression suite over the released database (eval/tests/test_reward_hacking.py)
